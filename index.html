<head>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) brightness(0.6);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .edge-aura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            box-shadow:
                inset 0 0 120px 40px rgba(0,0,0,0.9),
                inset 0 0 200px 80px rgba(0,0,0,0.5);
            animation: auraBreath 4s ease-in-out infinite alternate;
        }

        @keyframes auraBreath {
            0% { box-shadow: inset 0 0 100px 30px rgba(0,0,0,0.8), inset 0 0 180px 60px rgba(0,0,0,0.4); }
            100% { box-shadow: inset 0 0 140px 50px rgba(0,0,0,0.95), inset 0 0 250px 100px rgba(0,0,0,0.6); }
        }

        #venomCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 5;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            object-fit: cover;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .avatar:hover {
            transform: scale(1.1) rotate(5deg);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 50px rgba(255, 255, 255, 0.2);
        }

        .username {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .username:hover {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .bio {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 16px 24px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            transform: scale(1);
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border-color: rgba(255, 255, 255, 1);
            transform: scale(1.05) translateY(-4px);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.15);
        }

        .link-btn:active {
            transform: scale(0.97);
            transition: all 0.1s ease;
        }

        .link-btn svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .link-btn:hover svg {
            transform: scale(1.2);
        }

        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .music-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border-color: white;
            transform: scale(1.15) rotate(10deg);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
        }

        .music-btn:active {
            transform: scale(0.9);
            transition: all 0.1s ease;
        }

        .music-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .music-btn:hover svg {
            transform: scale(1.1);
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            transition: color 0.3s ease;
        }

        .footer:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .music-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .music-bar-fill {
            height: 100%;
            width: 0%;
            background: rgba(255, 255, 255, 0.6);
            transition: width 0.3s linear;
        }

        @media (max-width: 480px) {
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 32px;
            }

            .username {
                font-size: 20px;
            }

            .link-btn {
                padding: 14px 20px;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

    <script>
        // TENTACULES VENOM
        const canvas = document.getElementById('venomCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        let mouse = { x: -1000, y: -1000 };

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        document.addEventListener('mousemove', function(e) {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        class Tentacle {
            constructor() {
                this.reset();
            }
            reset() {
                var side = Math.floor(Math.random() * 4);
                if (side === 0) { this.x = Math.random() * W; this.y = -10; }
                else if (side === 1) { this.x = W + 10; this.y = Math.random() * H; }
                else if (side === 2) { this.x = Math.random() * W; this.y = H + 10; }
                else { this.x = -10; this.y = Math.random() * H; }

                this.segments = 30 + Math.floor(Math.random() * 20);
                this.points = [];
                this.maxLen = 120 + Math.random() * 180;
                this.thickness = 1 + Math.random() * 3;
                this.speed = 0.3 + Math.random() * 0.5;
                this.wobble = 0.5 + Math.random() * 1.5;
                this.offset = Math.random() * 1000;
                this.growing = true;
                this.life = 1;
                this.decay = 0.001 + Math.random() * 0.003;

                var dx = W / 2 - this.x;
                var dy = H / 2 - this.y;
                var dist = Math.sqrt(dx * dx + dy * dy);
                this.dirX = dx / dist;
                this.dirY = dy / dist;
            }
            update(t) {
                if (this.growing) {
                    var last = this.points.length > 0 ? this.points[this.points.length - 1] : { x: this.x, y: this.y };
                    var angle = Math.atan2(
                        mouse.y - last.y,
                        mouse.x - last.x
                    );
                    var mx = (mouse.x + last.x) / 2;
                    var my = (mouse.y + last.y) / 2;
                    var toMouse = Math.sqrt((mouse.x - last.x) ** 2 + (mouse.y - last.y) ** 2);

                    var nx = last.x + this.speed * 3;
                    var ny = last.y + Math.sin(t * 0.002 + this.offset + this.points.length * 0.3) * this.wobble;

                    if (toMouse > 80) {
                        nx += (mouse.x - last.x) * 0.02;
                        ny += (mouse.y - last.y) * 0.02;
                    } else {
                        nx -= (mouse.x - last.x) * 0.05;
                        ny -= (mouse.y - last.y) * 0.05;
                    }

                    nx += Math.sin(t * 0.003 + this.offset) * 0.8;
                    ny += Math.cos(t * 0.004 + this.offset) * 0.8;

                    this.points.push({ x: nx, y: ny });

                    if (this.points.length >= this.segments) {
                        this.growing = false;
                    }
                }

                this.life -= this.decay;
                if (this.life <= 0) this.reset();

                for (var i = 1; i < this.points.length; i++) {
                    var p = this.points[i];
                    var pp = this.points[i - 1];
                    var dx = mouse.x - p.x;
                    var dy = mouse.y - p.y;
                    var dist = Math.sqrt(dx * dx + dy * dy);
                    if (dist < 70) {
                        p.x -= dx * 0.03;
                        p.y -= dy * 0.03;
                    }
                }
            }
            draw() {
                if (this.points.length < 2) return;
                for (var i = 1; i < this.points.length; i++) {
                    var p1 = this.points[i - 1];
                    var p2 = this.points[i];
                    var progress = i / this.points.length;
                    var alpha = this.life * progress * 0.6;
                    var w = this.thickness * (1 - progress * 0.7);

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
                    ctx.lineWidth = w;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
                if (this.points.length > 0) {
                    var tip = this.points[this.points.length - 1];
                    ctx.beginPath();
                    ctx.arc(tip.x, tip.y, this.thickness * 0.8, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,' + (this.life * 0.4) + ')';
                    ctx.fill();
                }
            }
        }

        var tentacles = [];
        for (var i = 0; i < 12; i++) {
            tentacles.push(new Tentacle());
        }

        function animateVenom(t) {
            ctx.clearRect(0, 0, W, H);
            for (var i = 0; i < tentacles.length; i++) {
                tentacles[i].update(t);
                tentacles[i].draw();
            }
            requestAnimationFrame(animateVenom);
        }
        requestAnimationFrame(animateVenom);

        // YOUTUBE MUSIC
        var tag = document.createElement('script');
        tag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(tag);

        var player;
        var playing = false;

        function onYouTubeIframeAPIReady() {
            player = new YT.Player('ytPlayer', {
                height: '1',
                width: '1',
                videoId: 'MRmecqnNFb8',
                playerVars: {
                    autoplay: 0,
                    loop: 1,
                    playlist: 'MRmecqnNFb8',
                    controls: 0,
                    disablekb: 1,
                    modestbranding: 1
                },
                events: {
                    onReady: function(e) { e.target.unMute(); },
                    onStateChange: function(e) {
                        if (e.data === YT.PlayerState.ENDED) {
                            e.target.seekTo(0);
                            e.target.playVideo();
                        }
                    }
                }
            });
            setInterval(function() {
                if (player && player.getDuration && player.getDuration() > 0) {
                    var pct = (player.getCurrentTime() / player.getDuration()) * 100;
                    document.getElementById('musicBarFill').style.width = pct + '%';
                }
            }, 500);
        }

        function toggleMusic() {
            if (!player || !player.playVideo) return;
            if (playing) {
                player.pauseVideo();
                document.getElementById('playIcon').style.display = 'block';
                document.getElementById('pauseIcon').style.display = 'none';
            } else {
                player.playVideo();
                document.getElementById('playIcon').style.display = 'none';
                document.getElementById('pauseIcon').style.display = 'block';
            }
            playing = !playing;
        }
    </script>
</body>
